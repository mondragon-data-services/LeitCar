# /etc/nginx/sites-available/lavacar
# O ponto critico e o WebSocket. Sem as tres linhas de Upgrade o
# Streamlit fica reconectando para sempre.

server {
    server_name agendar.lavacar.com.br;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    server_name lavacar.com.br www.lavacar.com.br;
    root /var/www/landing;      # a landing estatica do SEO
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
